services:
  attacker:
    image: dc3lik/osl-attacker:${TAG:?run via manage.sh -- TAG not set}
    container_name: attacker
    hostname: attacker
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - lab-lpe-net
    ports:
      - "127.0.0.1:10600:22"
    volumes:
      - attacker-keys:/etc/ssh/host-keys
    depends_on:
      target-lpe01:
        condition: service_healthy
      target-lpe02:
        condition: service_healthy
      target-lpe03:
        condition: service_healthy
      target-lpe04:
        condition: service_healthy
      target-lpe05:
        condition: service_healthy
      target-lpe06:
        condition: service_healthy
      target-lpe07:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  lab-assistant:
    image: dc3lik/osl-assistant-lpe:${TAG:?run via manage.sh -- TAG not set}
    container_name: lab-assistant
    hostname: lab-assistant
    networks:
      - lab-lpe-net
    ports:
      - "127.0.0.1:10601:22"
    volumes:
      - assistant-keys:/etc/ssh/host-keys
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 5

  target-lpe01:
    image: dc3lik/osl-lpe-01:${TAG:?run via manage.sh -- TAG not set}
    container_name: target-lpe01
    hostname: target-lpe01
    networks:
      - lab-lpe-net
    ports:
      - "127.0.0.1:10610:22"
    environment:
      STUDENT_SECRET: ${STUDENT_ID:-changeme}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/22"]
      interval: 5s
      timeout: 3s
      retries: 10

